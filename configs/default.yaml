seed: 42
paths:
  data_dir: data
  reports_dir: reports
data:
  source: synthetic        # synthetic | csv | vendor
  start_date: "2024-01-02"
  n_days: 60
  session: ["09:00", "14:30"]
  timezone: America/New_York
  start_price: 75.0
  annual_vol: 0.35
  eia_events: true
  eia_time: "10:30"
  eia_weekday: 2           # Monday=0, so 2 = Wednesday
  csv:                     # generic CSV/parquet files: <root>/{quotes,trades}/YYYY-MM-DD.(csv|csv.gz|parquet)
    root: data/csv
    timezone: America/New_York   # used when file timestamps are naive
    columns: {}                  # optional {file_column: schema_column} renames
  vendor:                  # locally downloaded vendor MBP-1 / trades files (see adapters.VendorFileAdapter)
    root: data/vendor
    api_key_env: DATA_VENDOR_API_KEY   # read from the environment if a download client is added
  lee_ready_lag_ms: 0      # quote lag for Lee-Ready when the aggressor side is missing
generator:                     # synthetic market simulator (frozen after milestone 2 calibration)
  fine_dt: 0.25                # seconds; grid for the latent efficient price
  quote_interval: 1.0          # seconds between scheduled book refreshes (plus one after each trade)
  diffusion_scale: 0.72        # share of target vol carried by diffusion (trade impact adds the rest)
  regime:                      # daily two-state Markov chain: [calm, volatile]
    vol_mult: [0.8, 1.5]
    stay_prob: [0.9, 0.8]
  intraday:                    # U-shaped volatility / activity profile
    open_amp: 1.0
    open_tau_min: 30
    close_amp: 0.6
    close_tau_min: 20
  stoch_vol:                   # mean-reverting log-vol on a 1-minute grid
    phi_per_min: 0.98
    sigma: 0.1
  alpha:                       # latent short-term pressure: the planted, decaying signal
    half_life_s: 45
    drift_strength: 0.045      # per-second drift = drift_strength * sigma * alpha
    flow_loading: 0.2          # P(buy) = sigmoid(2 * flow_loading * alpha)
  hawkes:
    mean_rate: 4.0             # trades per second, session average
    branching: 0.6
    decay_s: 3.0
  metaorders:                  # Lillo-Mike-Farmer sign model
    n_active: 4
    length_tail: 1.5           # P(L >= l) ~ l^-tail
    max_length: 2000
    noise_frac: 0.3            # share of trades with an independent sign
  sizes:
    tail: 1.6                  # Pareto tail of child-trade size in lots
    max_lots: 100
  impact:                      # ticks per sqrt(lot)
    permanent: 0.03
    transient: 0.12
    transient_decay_s: 30
  spread:
    p_wide_base: 0.08
    vol_exponent: 2.0
    p_wide_max: 0.6
    p_three_given_wide: 0.25
    refresh_prob: 0.2
    eia_window_s: [-60, 300]
    eia_p_wide: 0.7
  depth:
    mean_lots: 15
    log_sigma: 0.5
    ar_phi: 0.95
    min_frac: 0.15
    levels: 5
    level_growth: 1.4
    deep_noise: 0.4
    alpha_tilt: 0.01             # deep-book (L2-L5) tilt toward alpha; recalibrated in M4 (was 0.1)
  eia:
    jump_pct: [0.3, 1.0]
    vol_amp: 3.0
    vol_decay_s: 180
    rate_amp: 4.0
    rate_decay_s: 120
validation:
  spike_ticks: 150             # flag prices this far from the rolling median (EIA jumps reach ~75)
  spike_window: 101            # rows in the rolling median
  max_gap_s: 30                # report gaps longer than this
calibration:
  probe_train_frac: 0.7        # share of days used to fit the probe regression
  acf_sign_lags: [1, 10, 100, 1000]
  rv_bar_s: 300                # bar length for realized-vol estimate
sampling:
  base_bar: 1s
  decision_interval: 10s
features:
  windows: [10, 30, 60, 300]   # seconds
  ema_pairs: [[10, 60], [30, 300]]   # EMA fast/slow spans (seconds) for the momentum spread
  vol_ratio_windows: [30, 300]       # short/long realized vol ratio
  min_stat_window: 30          # skewness and Kyle lambda only on windows at least this long
  volume_norm_window: 1800     # trailing seconds used to normalise signed volume
  history_days: 10             # prior days used for time-of-day intensity and vol-regime norms
  intensity_bucket_min: 5      # time-of-day buckets for the trade-intensity norm
  regime_window: 1800          # trailing seconds of realized vol for the regime indicator
  eia_clip_min: 60             # minutes-to-EIA is clipped to +/- this
target:
  horizon: 60                  # seconds
  horizons_report: [10, 30, 60, 300]
preprocess:
  warmup_seconds: 300          # drop the first seconds of each session (longest lookback)
  winsor_quantiles: [0.01, 0.99]
  winsor_target: true          # clip the training target at the same quantiles (evaluation uses raw)
  corr_filter: 0.9
  selection: lasso_stability   # none | lasso | lasso_stability
  stability_bootstraps: 50     # day-block subsamples for stability selection
  stability_sample_frac: 0.5   # share of training days in each subsample
  stability_threshold: 0.6     # keep features selected in at least this share of subsamples
cv:
  train_days: 20
  test_days: 5
  embargo_seconds: 120
  holdout_days: 10
models: [zero, ar1, ols, ridge, lasso]
model_params:
  inner_splits: 4              # expanding day-blocked splits inside each training fold (alpha choice)
  ridge_alphas: [1, 10, 100, 1000, 10000, 100000]
  lasso_alphas: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
  quantile_grid: 201           # stored quantiles of training-set predictions (percentile thresholds)
strategy:
  threshold_mode: ticks        # ticks | percentile (of the fold's training predictions)
  theta_entry_ticks: 1.0
  theta_exit_ticks: 0.3
  pct_entry: 0.97              # percentile mode: long above, short below 1 - pct_entry
  pct_exit: 0.80               # percentile mode: hold a long while above, a short while below 1 - pct_exit
  require_edge: true           # also require |y_hat| > live spread + fees (round-trip cost estimate)
  max_hold_seconds: 300
  stop_loss_ticks: 8
  take_profit_ticks: 12
  sizing: fixed                # fixed | linear | vol_target
  base_size: 1
  max_size: 3                  # cap for linear and vol_target sizing
  vol_target_ticks: 10         # vol_target: size * (60 s realized vol in ticks) ~ this
execution:
  latency_ms: 1000
  fee_per_contract_rt: 2.50
  slippage_model: l2_or_sqrt
  sqrt_impact_coef: 0.5        # ticks of extra slippage per sqrt(excess lots / L1 size) without L2
penalties:
  eod_flatten_time: "14:25"
  eod_penalty_ticks: 1
  forced_liq_penalty_ticks: 3
firewalls:
  enabled: true
  max_position: 5
  max_order_size: 3
  price_band_ticks: 5
  max_spread_ticks: 2
  stale_quote_ms: 2000
  max_orders_per_min: 6
  vol_breaker_mult: 3.0
  news_blackout: ["10:28", "10:35"]
  daily_loss_limit_usd: 1500
  max_drawdown_usd: 5000
  loss_streak_n: 5
  loss_streak_cooldown_min: 15
